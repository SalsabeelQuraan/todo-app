<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Tasks - To-Do List</title>
        <script>
            try {
                var t =
                    localStorage.getItem('todo.theme') ||
                    (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
        <style>
            :root {
                color-scheme: light;
                --bg: #f8fafc;
                --card: #fff;
                --text: #1e293b;
                --muted: #64748b;
                --primary: #6366f1;
                --primary-h: #4f46e5;
                --primary-l: #e0e7ff;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
                --danger-l: #fee2e2;
                --border: #e2e8f0;
                --surface-2: #f1f5f9;
                --input-bg: #fafbfc;
                --border-strong: #cbd5e1;
                --done-bg: #fafafa;
                --sh-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
                --sh-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
                --sh-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
                --r-sm: 6px;
                --r-md: 12px;
                --r-lg: 16px;
                --tr: all 0.2s ease-in-out;
                --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            }
            /* ===== Base ===== */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--font);
                line-height: 1.5;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 40px 16px 24px;
            }
            .app-container {
                width: 100%;
                max-width: 640px;
                margin: 0 auto;
            }
            header {
                text-align: center;
                margin-bottom: 28px;
            }
            .brand-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                background: linear-gradient(135deg, var(--primary), #818cf8);
                color: #fff;
                border-radius: var(--r-md);
                margin-bottom: 12px;
                box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
            }
            .brand-badge svg {
                width: 26px;
                height: 26px;
            }
            h1 {
                font-size: 1.875rem;
                font-weight: 700;
                letter-spacing: -0.025em;
            }
            .subtitle {
                color: var(--muted);
                font-size: 0.95rem;
                margin-top: 4px;
            }
            /* ===== Summary cards ===== */
            .summary-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                margin-bottom: 24px;
            }
            .summary-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--r-md);
                padding: 14px 16px;
                text-align: center;
                box-shadow: var(--sh-sm);
                transition: var(--tr);
            }
            .summary-card:hover {
                transform: translateY(-2px);
                box-shadow: var(--sh-md);
            }
            .summary-card .label {
                font-size: 0.75rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--muted);
            }
            .summary-card .value {
                font-size: 1.6rem;
                font-weight: 700;
                margin-top: 4px;
            }
            .total .value {
                color: var(--primary);
            }
            .completed .value {
                color: var(--success);
            }
            .remaining .value {
                color: var(--warning);
            }
            /* ===== Main box & add form ===== */
            .todo-box {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--r-lg);
                padding: 24px;
                box-shadow: var(--sh-lg);
            }
            .add-form {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-bottom: 20px;
            }
            .input-wrapper {
                flex: 1;
            }
            .input-wrapper input {
                width: 100%;
                height: 46px;
                padding: 0 16px;
                border: 1.5px solid var(--border);
                border-radius: var(--r-md);
                font-size: 0.95rem;
                font-family: inherit;
                color: var(--text);
                background: var(--input-bg);
                transition: var(--tr);
            }
            .input-wrapper input:focus {
                outline: none;
                background: var(--card);
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            }
            .input-wrapper input::placeholder {
                color: #94a3b8;
            }
            .input-wrapper input.invalid {
                border-color: var(--danger);
                box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
            }
            .btn-primary {
                height: 46px;
                padding: 0 20px;
                background: var(--primary);
                color: #fff;
                border: none;
                border-radius: var(--r-md);
                font-size: 0.95rem;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: var(--tr);
                white-space: nowrap;
            }
            .btn-primary:hover {
                background: var(--primary-h);
            }
            /* ===== Filters ===== */
            .filters-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid var(--border);
                padding-bottom: 16px;
                margin-bottom: 16px;
            }
            .filters-group {
                display: flex;
                gap: 6px;
                background: var(--surface-2);
                padding: 4px;
                border-radius: var(--r-md);
            }
            .filter-btn {
                background: transparent;
                border: none;
                padding: 6px 14px;
                border-radius: var(--r-sm);
                font-size: 0.85rem;
                font-weight: 550;
                font-family: inherit;
                color: var(--muted);
                cursor: pointer;
                transition: var(--tr);
            }
            .filter-btn:hover {
                color: var(--text);
            }
            .filter-btn.active {
                background: var(--card);
                color: var(--primary);
                font-weight: 600;
                box-shadow: var(--sh-sm);
            }
            .filter-status-info {
                font-size: 0.8rem;
                color: var(--muted);
            }
            /* ===== Task list ===== */
            .task-list {
                list-style: none;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .task-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 14px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--r-md);
                transition: var(--tr);
                gap: 12px;
            }
            .task-item:hover {
                border-color: var(--border-strong);
                box-shadow: var(--sh-sm);
            }
            .task-item.completed {
                background: var(--done-bg);
                border-color: var(--border);
            }
            .task-left {
                display: flex;
                align-items: center;
                gap: 12px;
                flex: 1;
                min-width: 0;
            }
            .custom-checkbox {
                width: 20px;
                height: 20px;
                border: 2px solid var(--border-strong);
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: var(--tr);
                flex-shrink: 0;
                background: var(--card);
                padding: 0;
            }
            .custom-checkbox:hover {
                border-color: var(--primary);
            }
            .custom-checkbox.checked {
                background: var(--success);
                border-color: var(--success);
            }
            .custom-checkbox svg {
                display: none;
                width: 13px;
                height: 13px;
                stroke: #fff;
                stroke-width: 3;
            }
            .custom-checkbox.checked svg {
                display: block;
            }
            .task-title {
                font-size: 0.95rem;
                word-break: break-word;
                transition: var(--tr);
            }
            .task-item.completed .task-title {
                text-decoration: line-through;
                color: var(--muted);
            }
            .task-actions {
                display: flex;
                gap: 4px;
                flex-shrink: 0;
            }
            .action-btn {
                width: 32px;
                height: 32px;
                border-radius: var(--r-sm);
                border: 1px solid transparent;
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                transition: var(--tr);
            }
            .action-btn:hover {
                background: var(--surface-2);
                color: var(--text);
            }
            .action-btn.delete-btn:hover {
                background: var(--danger-l);
                color: var(--danger);
            }
            .action-btn.edit-btn:hover {
                background: var(--primary-l);
                color: var(--primary);
            }
            .edit-task-wrapper {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                flex: 1;
                align-items: center;
            }
            .edit-input {
                flex: 1 1 100%;
                min-width: 0;
                background: var(--card);
                height: 36px;
                padding: 0 12px;
                border: 1.5px solid var(--primary);
                border-radius: var(--r-sm);
                font-size: 0.95rem;
                font-family: inherit;
                color: var(--text);
                outline: none;
            }
            .btn-save {
                height: 34px;
                padding: 0 12px;
                background: var(--primary);
                color: #fff;
                border: none;
                border-radius: var(--r-sm);
                font-size: 0.85rem;
                font-weight: 600;
                cursor: pointer;
                transition: var(--tr);
            }
            .btn-save:hover {
                background: var(--primary-h);
            }
            .btn-cancel {
                height: 34px;
                padding: 0 12px;
                background: var(--surface-2);
                color: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--r-sm);
                font-size: 0.85rem;
                font-weight: 500;
                cursor: pointer;
                transition: var(--tr);
            }
            .btn-cancel:hover {
                color: var(--text);
                background: var(--border);
            }
            /* ===== Empty state & footer ===== */
            .empty-state {
                text-align: center;
                padding: 44px 20px;
            }
            .empty-icon {
                width: 56px;
                height: 56px;
                margin: 0 auto 14px;
                border-radius: 50%;
                background: var(--surface-2);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--muted);
            }
            .empty-icon svg {
                width: 28px;
                height: 28px;
            }
            .empty-title {
                font-size: 1.1rem;
                font-weight: 600;
                margin-bottom: 4px;
            }
            .empty-desc {
                font-size: 0.9rem;
                color: var(--muted);
            }
            .list-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 16px;
                padding-top: 14px;
                border-top: 1px solid var(--border);
                font-size: 0.8rem;
                color: var(--muted);
            }
            .btn-clear {
                background: none;
                border: none;
                color: var(--danger);
                font-family: inherit;
                font-size: 0.8rem;
                font-weight: 600;
                cursor: pointer;
                padding: 4px 8px;
                border-radius: var(--r-sm);
            }
            .btn-clear:hover {
                background: var(--danger-l);
            }
            .btn-clear[disabled] {
                opacity: 0.4;
                cursor: not-allowed;
                background: none;
            }

            /* ===== Dark mode ===== */
            [data-theme='dark'] {
                color-scheme: dark;
                --bg: #0f172a;
                --card: #1e293b;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --primary-l: #312e81;
                --danger-l: #450a0a;
                --border: #334155;
                --surface-2: #273449;
                --input-bg: #0f172a;
                --border-strong: #475569;
                --done-bg: #182234;
                --sh-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
                --sh-md: 0 4px 6px rgba(0, 0, 0, 0.4);
                --sh-lg: 0 10px 15px rgba(0, 0, 0, 0.4);
            }
            header {
                position: relative;
            }
            .theme-toggle {
                position: absolute;
                top: 0;
                right: 0;
                width: 40px;
                height: 40px;
                border-radius: var(--r-md);
                border: 1px solid var(--border);
                background: var(--card);
                color: var(--muted);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: var(--tr);
            }
            .theme-toggle:hover {
                color: var(--primary);
                border-color: var(--primary);
            }
            .theme-toggle svg {
                width: 20px;
                height: 20px;
            }
            .icon-sun {
                display: none;
            }
            [data-theme='dark'] .icon-sun {
                display: block;
            }
            [data-theme='dark'] .icon-moon {
                display: none;
            }
            .add-row {
                display: flex;
                gap: 10px;
            }
            .meta-row,
            .search-row {
                display: flex;
                gap: 10px;
            }
            .meta-row {
                flex-wrap: wrap;
            }
            .search-row {
                margin-bottom: 14px;
            }
            .field {
                display: flex;
                flex-direction: column;
                gap: 3px;
                flex: 1;
                min-width: 120px;
                font-size: 0.72rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--muted);
            }
            .field select,
            .field input,
            .select,
            .edit-select {
                height: 38px;
                padding: 0 10px;
                border: 1.5px solid var(--border);
                border-radius: var(--r-sm);
                background: var(--input-bg);
                color: var(--text);
                font: inherit;
                font-size: 0.85rem;
                font-weight: 400;
                text-transform: none;
                letter-spacing: normal;
            }
            .search-input {
                flex: 1;
                min-width: 0;
                height: 40px;
                padding: 0 14px;
                border: 1.5px solid var(--border);
                border-radius: var(--r-md);
                background: var(--input-bg);
                color: var(--text);
                font: inherit;
                font-size: 0.9rem;
            }
            .field select:focus,
            .field input:focus,
            .select:focus,
            .search-input:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            }
            /* ===== Task details, chips, drag & drop, toast ===== */
            .task-main {
                display: flex;
                flex-direction: column;
                gap: 4px;
                min-width: 0;
            }
            .task-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
            }
            .chip {
                font-size: 0.7rem;
                font-weight: 600;
                padding: 2px 8px;
                border-radius: 999px;
                background: var(--surface-2);
                color: var(--muted);
            }
            .chip.cat-work {
                background: #dbeafe;
                color: #1d4ed8;
            }
            .chip.cat-study {
                background: #ede9fe;
                color: #6d28d9;
            }
            .chip.cat-personal {
                background: #dcfce7;
                color: #15803d;
            }
            .chip.pri-high,
            .chip.due.overdue {
                background: var(--danger-l);
                color: var(--danger);
            }
            .chip.pri-medium {
                background: #fef3c7;
                color: #b45309;
            }
            .chip.pri-low {
                background: #dcfce7;
                color: #15803d;
            }
            [data-theme='dark'] .chip.cat-work {
                background: #1e3a8a;
                color: #bfdbfe;
            }
            [data-theme='dark'] .chip.cat-study {
                background: #4c1d95;
                color: #ddd6fe;
            }
            [data-theme='dark'] .chip.cat-personal,
            [data-theme='dark'] .chip.pri-low {
                background: #14532d;
                color: #bbf7d0;
            }
            [data-theme='dark'] .chip.pri-medium {
                background: #78350f;
                color: #fde68a;
            }
            .task-item.overdue {
                border-left: 3px solid var(--danger);
            }
            .task-item[draggable='true'] {
                cursor: grab;
            }
            .drag-handle {
                color: var(--border-strong);
                font-size: 0.9rem;
                letter-spacing: -2px;
                user-select: none;
                flex-shrink: 0;
            }
            .task-item.dragging {
                opacity: 0.4;
            }
            .task-item.drag-over {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-l);
            }
            .toast {
                position: fixed;
                left: 50%;
                bottom: 24px;
                transform: translate(-50%, 20px);
                background: var(--text);
                color: var(--card);
                padding: 10px 14px;
                border-radius: var(--r-md);
                box-shadow: var(--sh-lg);
                display: flex;
                align-items: center;
                gap: 14px;
                font-size: 0.9rem;
                opacity: 0;
                pointer-events: none;
                transition: var(--tr);
                z-index: 50;
            }
            .toast.show {
                opacity: 1;
                pointer-events: auto;
                transform: translate(-50%, 0);
            }
            .toast button {
                background: none;
                border: none;
                color: var(--primary);
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }
            :focus-visible {
                outline: 2px solid var(--primary);
                outline-offset: 2px;
            }
            /* ===== Responsive & accessibility ===== */
            @media (max-width: 540px) {
                body {
                    padding: 24px 12px;
                }
                .todo-box {
                    padding: 16px;
                }
                .summary-grid {
                    gap: 8px;
                }
                .summary-card {
                    padding: 10px 8px;
                }
                .summary-card .value {
                    font-size: 1.35rem;
                }
                .add-row,
                .search-row {
                    flex-direction: column;
                }
                .btn-primary {
                    width: 100%;
                    justify-content: center;
                }
                .filters-bar {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 12px;
                }
                .filters-group {
                    justify-content: space-around;
                }
                .filter-status-info {
                    text-align: center;
                }
                .edit-task-wrapper {
                    flex-wrap: wrap;
                }
                .btn-save,
                .btn-cancel {
                    flex: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="app-container">
            <header>
                <button type="button" class="theme-toggle" id="themeBtn" aria-label="Toggle dark mode">
                    <svg class="icon-moon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"
                        />
                    </svg>
                    <svg class="icon-sun" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            stroke-linecap="round"
                            d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"
                        />
                    </svg>
                </button>
                <div class="brand-badge" aria-hidden="true">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
                        />
                    </svg>
                </div>
                <h1>My Tasks</h1>
                <p class="subtitle">Stay organized, one task at a time.</p>
            </header>

            <section class="summary-grid" aria-label="Task Summary">
                <div class="summary-card total">
                    <div class="label">Total Tasks</div>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="summary-card completed">
                    <div class="label">Completed</div>
                    <div class="value" id="completedCount">0</div>
                </div>
                <div class="summary-card remaining">
                    <div class="label">Remaining</div>
                    <div class="value" id="remainingCount">0</div>
                </div>
            </section>

            <main class="todo-box">
                <form id="taskForm" class="add-form" autocomplete="off" novalidate>
                    <div class="add-row">
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="taskInput"
                                placeholder="What do you need to do?"
                                aria-label="New task title"
                                maxlength="150"
                            />
                        </div>
                        <button type="submit" class="btn-primary" id="addBtn">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2.5"
                                    d="M12 4v16m8-8H4"
                                />
                            </svg>
                            <span>Add Task</span>
                        </button>
                    </div>
                    <div class="meta-row">
                        <label class="field">
                            Category
                            <select id="taskCategory">
                                <option value="">None</option>
                                <option value="work">Work</option>
                                <option value="study">Study</option>
                                <option value="personal">Personal</option>
                            </select>
                        </label>
                        <label class="field">
                            Priority
                            <select id="taskPriority">
                                <option value="high">High</option>
                                <option value="medium" selected>Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </label>
                        <label class="field">
                            Due date
                            <input type="date" id="taskDue" />
                        </label>
                    </div>
                </form>

                <div class="search-row">
                    <input
                        type="search"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search tasks..."
                        aria-label="Search tasks"
                    />
                    <select id="categoryFilter" class="select" aria-label="Filter by category">
                        <option value="all">All categories</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                        <option value="personal">Personal</option>
                    </select>
                </div>

                <div class="filters-bar">
                    <div class="filters-group" role="group" aria-label="Filter tasks">
                        <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">
                            All
                        </button>
                        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">
                            Active
                        </button>
                        <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">
                            Completed
                        </button>
                    </div>
                    <div class="filter-status-info" id="filterStatusInfo" aria-live="polite">Showing all tasks</div>
                </div>

                <ul class="task-list" id="taskList" aria-label="Tasks list"></ul>

                <div class="empty-state" id="emptyState" style="display: none">
                    <div class="empty-icon" aria-hidden="true">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.8"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                            />
                        </svg>
                    </div>
                    <h2 class="empty-title" id="emptyTitle">No tasks yet!</h2>
                    <p class="empty-desc" id="emptyDesc">Start by adding your first task.</p>
                </div>

                <div class="list-footer">
                    <span>Saved on the Server</span>
                    <button type="button" class="btn-clear" id="clearCompletedBtn">Clear completed</button>
                </div>
            </main>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite">
            <span id="toastMsg"></span>
            <button type="button" id="undoBtn">Undo</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
